version: 1.3.14

cache: true

fileStrategy: "s3"

balance:
  enabled: true                 # Enforce budget limits
  startBalance: 10000000        # Initial $10 credit allocation on sign-up (10M credits)
  autoRefillEnabled: false       # Enable automatic daily reset/top-up
  refillIntervalValue: 1        # Every 1
  refillIntervalUnit: "days"    # "days" | "hours" | "weeks" | "months"
  refillAmount: 10000000        # Adds $10 (10M credits) every day

transactions:
  enabled: true                 # Logs usage and cost per query to MongoDB

registration:
  allowedDomains:
    - "kifli.tech"

interface:
  customWelcome: "Üdvözöl a ManaGPT! Miben segíthetek ma?"
  modelSelect: false
  parameters: false
  presets: false
  prompts:
    use: true
    create: true
  bookmarks: true
  multiConvo: false
  agents:
    use: false
  fileSearch: true
  marketplace:
    use: false
  privacyPolicy:
    externalUrl: 'https://ineedmana.io/hu/jogi/adatkezelesi-tajekoztato'
    openNewTab: true

endpoints:
  custom:
    - name: "OpenRouter"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      headers:
        x-librechat-body-parentmessageid: "{{LIBRECHAT_BODY_PARENTMESSAGEID}}"
      models:
        default:
          - "openai/gpt-5.6-luna"
        fetch: false
      titleConvo: true
      titleModel: "openai/gpt-5.6-luna"
      dropParams: ["stop"]
      modelDisplayLabel: "ManaGPT"
      iconURL: "/assets/logo.webp"

modelSpecs:
  list:
    - name: "managpt"
      label: "ManaGPT"
      description: "Intelligens asszisztens a mindennapi feladatokhoz"
      iconURL: "/assets/logo.webp"
      default: true
      preset:
        endpoint: "OpenRouter"
        model: "openai/gpt-5.6-luna"
        modelLabel: "ManaGPT"
        conversationStarters:
          - "Segíts megfogalmazni egy hivatalos levelet a társasházkezelőnek."
          - "Milyen egyszerű receptet tudsz ajánlani csirkemellből és zöldségekből?"
          - "Magyarázd el egyszerűen és röviden: mit jelent a mesterséges intelligencia?"
